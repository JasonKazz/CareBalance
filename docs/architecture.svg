<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#608c80"/></marker></defs><rect width="1200" height="780" fill="#f0f6f1"/><g font-family="Arial, sans-serif" fill="#193f37"><text x="60" y="62" font-size="34" font-weight="bold">CareBalance · Community clinic contract planning</text><text x="60" y="100" font-size="18">Implemented architecture — one local Python server, no external providers</text><rect x="60" y="150" width="320" height="165" rx="16" fill="white" stroke="#b9d0be" stroke-width="2"/><text x="80" y="185" font-size="20" font-weight="bold">1. Clinic assumptions</text><text x="80" y="219" font-size="16" fill="#526d5b">Patients, visits, available slots</text><text x="80" y="245" font-size="16" fill="#526d5b">Operating costs, payment offers</text><text x="80" y="271" font-size="16" fill="#526d5b">Budget, margin, stress case</text><rect x="440" y="150" width="320" height="165" rx="16" fill="white" stroke="#b9d0be" stroke-width="2"/><text x="460" y="185" font-size="20" font-weight="bold">2. Local Python API</text><text x="460" y="219" font-size="16" fill="#526d5b">Shared JSON input schema</text><text x="460" y="245" font-size="16" fill="#526d5b">Finite values and bounded inputs</text><text x="460" y="271" font-size="16" fill="#526d5b">Synthetic scenario fixture</text><rect x="820" y="150" width="320" height="165" rx="16" fill="white" stroke="#b9d0be" stroke-width="2"/><text x="840" y="185" font-size="20" font-weight="bold">3. Monthly accounting</text><text x="840" y="219" font-size="16" fill="#526d5b">Per-visit vs. per-patient payment</text><text x="840" y="245" font-size="16" fill="#526d5b">Separate costs from payments</text><text x="840" y="271" font-size="16" fill="#526d5b">Same visit needs in both models</text><path d="M380,232 L435,232" stroke="#608c80" stroke-width="2" marker-end="url(#arrow)"/><path d="M760,232 L815,232" stroke="#608c80" stroke-width="2" marker-end="url(#arrow)"/><rect x="820" y="410" width="320" height="165" rx="16" fill="white" stroke="#b9d0be" stroke-width="2"/><text x="840" y="445" font-size="20" font-weight="bold">4. Feasible terms</text><text x="840" y="479" font-size="16" fill="#526d5b">Intersect baseline + stress bounds</text><text x="840" y="505" font-size="16" fill="#526d5b">Minimum margin / maximum budget</text><text x="840" y="531" font-size="16" fill="#526d5b">Reject capacity overload</text><path d="M980,315 L980,405" stroke="#608c80" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="410" width="320" height="165" rx="16" fill="white" stroke="#b9d0be" stroke-width="2"/><text x="460" y="445" font-size="20" font-weight="bold">5. Browser results</text><text x="460" y="479" font-size="16" fill="#526d5b">Compare offers and rate ranges</text><text x="460" y="505" font-size="16" fill="#526d5b">Stress chart + capacity threshold</text><text x="460" y="531" font-size="16" fill="#526d5b">Inspect formulas and export JSON</text><path d="M820,492 L765,492" stroke="#608c80" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="410" width="320" height="165" rx="16" fill="white" stroke="#b9d0be" stroke-width="2"/><text x="80" y="445" font-size="20" font-weight="bold">6. Verification</text><text x="80" y="479" font-size="16" fill="#526d5b">Hand-calculated accounting tests</text><text x="80" y="505" font-size="16" fill="#526d5b">Rate-boundary + API tests</text><text x="80" y="531" font-size="16" fill="#526d5b">Browser scenario checks</text><path d="M440,492 L385,492" stroke="#608c80" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="650" font-size="19" font-weight="bold">Decision: which payment terms satisfy the clinic’s stated constraints?</text><text x="60" y="692" font-size="16" fill="#526d5b">Synthetic planning model. No predicted clinical benefit, automatic patient selection, or universal fair-price claim.</text><text x="60" y="724" font-size="16" fill="#526d5b">Frontend: HTML / CSS / JavaScript     Backend: standard-library Python     Data: local JSON, no persistence</text></g></svg>