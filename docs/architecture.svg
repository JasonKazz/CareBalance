<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670"><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#6c8860"/></marker></defs><rect width="1200" height="670" fill="#f5f6f0"/><g font-family="Arial,sans-serif" fill="#254a35"><text x="55" y="60" font-size="34" font-weight="bold">CareBalance · Contract Lens</text><text x="55" y="96" font-size="18">A document-to-evidence-to-calculation workflow</text><rect x="55" y="150" width="320" height="165" rx="14" fill="#fffefa" stroke="#cbd8bf"/><text x="75" y="185" font-size="20" font-weight="bold">1. Offer + activity</text><text x="75" y="222" font-size="16" fill="#77876d">PDF / TXT payment offer</text><text x="75" y="247" font-size="16" fill="#77876d">Aggregate annual service CSV</text><text x="75" y="272" font-size="16" fill="#77876d">Fictional examples included</text><rect x="440" y="150" width="320" height="165" rx="14" fill="#fffefa" stroke="#cbd8bf"/><text x="460" y="185" font-size="20" font-weight="bold">2. Extract candidates</text><text x="460" y="222" font-size="16" fill="#77876d">Local structured-row parser</text><text x="460" y="247" font-size="16" fill="#77876d">OR opt-in Gemini extraction</text><text x="460" y="272" font-size="16" fill="#77876d">Bounded local PDF text reader</text><rect x="825" y="150" width="320" height="165" rx="14" fill="#fffefa" stroke="#cbd8bf"/><text x="845" y="185" font-size="20" font-weight="bold">3. Review evidence</text><text x="845" y="222" font-size="16" fill="#77876d">Quote, code and amount checks</text><text x="845" y="247" font-size="16" fill="#77876d">Review / correct / select rates</text><text x="845" y="272" font-size="16" fill="#77876d">Explicit confirmation required</text><rect x="825" y="390" width="320" height="165" rx="14" fill="#fffefa" stroke="#cbd8bf"/><text x="845" y="425" font-size="20" font-weight="bold">4. Reprice exactly</text><text x="845" y="462" font-size="16" fill="#77876d">Match complete service codes</text><text x="845" y="487" font-size="16" fill="#77876d">Decimal monetary arithmetic</text><text x="845" y="512" font-size="16" fill="#77876d">Exclude unmatched services</text><rect x="440" y="390" width="320" height="165" rx="14" fill="#fffefa" stroke="#cbd8bf"/><text x="460" y="425" font-size="20" font-weight="bold">5. Explore a counteroffer</text><text x="460" y="462" font-size="16" fill="#77876d">Uniform hypothetical uplift</text><text x="460" y="487" font-size="16" fill="#77876d">Cent rounding per service</text><text x="460" y="512" font-size="16" fill="#77876d">Original source rates retained</text><rect x="55" y="390" width="320" height="165" rx="14" fill="#fffefa" stroke="#cbd8bf"/><text x="75" y="425" font-size="20" font-weight="bold">6. Explain the impact</text><text x="75" y="462" font-size="16" fill="#77876d">Annual change contributions</text><text x="75" y="487" font-size="16" fill="#77876d">Volume + reimbursement coverage</text><text x="75" y="512" font-size="16" fill="#77876d">Source passages and JSON export</text><path d="M375,233 L433,233" stroke="#6c8860" stroke-width="2" marker-end="url(#a)"/><path d="M760,233 L818,233" stroke="#6c8860" stroke-width="2" marker-end="url(#a)"/><path d="M985,315 L985,383" stroke="#6c8860" stroke-width="2" marker-end="url(#a)"/><path d="M825,473 L767,473" stroke="#6c8860" stroke-width="2" marker-end="url(#a)"/><path d="M440,473 L382,473" stroke="#6c8860" stroke-width="2" marker-end="url(#a)"/><text x="55" y="612" font-size="16" fill="#77876d">Gemini extracts terms. Python computes impact. Users determine applicability.</text><text x="55" y="640" font-size="15" fill="#77876d">Local prototype · no database · no saved documents · explicit assumptions · capacity planner retained at /clinic</text></g></svg>