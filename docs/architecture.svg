<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#608c80"/></marker></defs><rect width="1200" height="790" fill="#eef5f2"/><g font-family="Arial, sans-serif" fill="#153e36"><text x="60" y="64" font-size="36" font-weight="bold">CareBalance</text><text x="60" y="101" font-size="19">Payment simulator · basic architecture</text><text x="60" y="137" font-size="15" fill="#526d64">Solid: implemented starter. Dashed: planned simulator components.</text><rect x="60" y="180" width="310" height="130" rx="16" fill="white" stroke="#608c80" stroke-width="2"/><text x="82" y="214" font-size="20" font-weight="bold">Frontend</text><text x="82" y="245" font-size="16" fill="#526d64">HTML · CSS · JavaScript</text><text x="82" y="270" font-size="16" fill="#526d64">Starter page + health check</text><rect x="440" y="180" width="310" height="130" rx="16" fill="white" stroke="#608c80" stroke-width="2"/><text x="462" y="214" font-size="20" font-weight="bold">Python backend</text><text x="462" y="245" font-size="16" fill="#526d64">One local server · port 3200</text><text x="462" y="270" font-size="16" fill="#526d64">Serves frontend + health API</text><rect x="820" y="180" width="320" height="130" rx="16" fill="white" stroke="#608c80" stroke-width="2" stroke-dasharray="7 5"/><text x="842" y="214" font-size="20" font-weight="bold">Synthetic inputs</text><text x="842" y="245" font-size="16" fill="#526d64">One episode of care</text><text x="842" y="270" font-size="16" fill="#526d64">Explicit, editable assumptions</text><path d="M370,245 L435,245" stroke="#608c80" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="370" width="310" height="145" rx="16" fill="white" stroke="#608c80" stroke-width="2" stroke-dasharray="7 5"/><text x="462" y="404" font-size="20" font-weight="bold">Scenario engine</text><text x="462" y="435" font-size="16" fill="#526d64">Validate and bound inputs</text><text x="462" y="460" font-size="16" fill="#526d64">Apply identical patient scenarios</text><text x="462" y="485" font-size="16" fill="#526d64">Compare three payment models</text><path d="M595,310 L595,365" stroke="#608c80" stroke-width="2" marker-end="url(#arrow)"/><path d="M980,310 L980,340 L755,440" fill="none" stroke="#608c80" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="370" width="310" height="145" rx="16" fill="white" stroke="#608c80" stroke-width="2" stroke-dasharray="7 5"/><text x="82" y="404" font-size="20" font-weight="bold">Payment models</text><text x="82" y="435" font-size="16" fill="#526d64">Fee-for-service</text><text x="82" y="460" font-size="16" fill="#526d64">Bundled payment</text><text x="82" y="485" font-size="16" fill="#526d64">Simplified shared savings</text><path d="M440,440 L375,440" stroke="#608c80" stroke-width="2" marker-end="url(#arrow)"/><rect x="820" y="370" width="320" height="145" rx="16" fill="white" stroke="#608c80" stroke-width="2" stroke-dasharray="7 5"/><text x="842" y="404" font-size="20" font-weight="bold">Shared schemas + tests</text><text x="842" y="435" font-size="16" fill="#526d64">Request and result contracts</text><text x="842" y="460" font-size="16" fill="#526d64">Hand-checked arithmetic</text><text x="842" y="485" font-size="16" fill="#526d64">Accounting consistency</text><rect x="440" y="575" width="310" height="125" rx="16" fill="white" stroke="#608c80" stroke-width="2" stroke-dasharray="7 5"/><text x="462" y="609" font-size="20" font-weight="bold">Results + bounded search</text><text x="462" y="640" font-size="16" fill="#526d64">Payments · costs · margins</text><text x="462" y="665" font-size="16" fill="#526d64">Feasible terms or no solution</text><path d="M595,515 L595,570" stroke="#608c80" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="575" width="310" height="125" rx="16" fill="white" stroke="#608c80" stroke-width="2" stroke-dasharray="7 5"/><text x="82" y="609" font-size="20" font-weight="bold">Interactive results</text><text x="82" y="640" font-size="16" fill="#526d64">Charts and scenario sliders</text><text x="82" y="665" font-size="16" fill="#526d64">Risk and assumption visibility</text><path d="M440,635 L375,635" stroke="#608c80" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="755" font-size="16" fill="#526d64">No database or LLM required. Simulated financial tradeoffs; no predicted clinical benefit.</text></g></svg>